apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    spec:
      containers:
      - name: demo-api
        image: techsalad/csg-onboarding:latest
        env:
        - name: GO_ENV
          value: "development"